<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h2>Từ điển Anh - Việt</h2>

<input type="text" id="word" placeholder="Nhập từ tiếng Anh">
<button onclick="translateWord()">Dịch</button>

<p id="result"></p>

<script>
  let english = ["hello", "apple", "book", "cat", "dog"];
  let vietnamese = ["xin chào", "quả táo", "quyển sách", "con mèo", "con chó"];

  function translateWord() {
    let input = document.getElementById("word").value.toLowerCase();
    let found = false;

    for (let i = 0; i < english.length; i++) {
      if (input === english[i]) {
        document.getElementById("result").innerHTML =
                "Nghĩa: " + vietnamese[i];
        found = true;
        break;
      }
    }

    if (!found) {
      document.getElementById("result").innerHTML = "Không tìm thấy";
    }
  }
</script>
</body>
</html>
