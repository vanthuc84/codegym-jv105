</html><h2>Tính số ngày trong tháng</h2>

<input type="number" id="month" placeholder="Nhập tháng (1-12)">
<button onclick="tinhNgay()">Tính số ngày</button>

<p id="result"></p>

<script>
  function tinhNgay() {
    let month = parseInt(document.getElementById("month").value);
    let result = "";

    switch(month) {
      case 1:
      case 3:
      case 5:
      case 7:
      case 8:
      case 10:
      case 12:
        result = "Tháng " + month + " có 31 ngày";
        break;

      case 4:
      case 6:
      case 9:
      case 11:
        result = "Tháng " + month + " có 30 ngày";
        break;

      case 2:
        result = "Tháng 2 có 28 hoặc 29 ngày";
        break;

      default:
        result = "Tháng không hợp lệ";
    }

    document.getElementById("result").innerHTML = result;
  }
</script>
