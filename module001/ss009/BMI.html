<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h2>Tính chỉ số BMI</h2>

<!-- Nhập cân nặng -->
<label>Cân nặng (kg):</label>
<input type="number" id="weight"><br><br>

<!-- Nhập chiều cao -->
<label>Chiều cao (m):</label>
<input type="number" id="height"><br><br>

<!-- Nút tính -->
<button onclick="tinhBMI()">Tính BMI</button>

<!-- Kết quả -->
<p id="result"></p>

<script>
  function tinhBMI() {
    let weight = document.getElementById("weight").value;
    let height = document.getElementById("height").value;

    let bmi = weight / (height * height);
    bmi = bmi.toFixed(2); // làm tròn 2 số

    let ketQua = "";

    if (bmi < 18.5) {
      ketQua = "Gầy";
    } else if (bmi < 25) {
      ketQua = "Bình thường";
    } else if (bmi < 30) {
      ketQua = "Thừa cân";
    } else {
      ketQua = "Béo phì";
    }

    document.getElementById("result").innerHTML =
            "BMI: " + bmi + " → " + ketQua;
  }
</script>

</body>
</html>
