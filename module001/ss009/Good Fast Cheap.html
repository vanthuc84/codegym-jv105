<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Good Fast Cheap</title>
</head>
<title>Good - Fast - Cheap</title>
<style>
  body {
    font-family: Arial;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #f2f2f2;
  }

  .container {
    text-align: left;
  }

  .row {
    display: flex;
    align-items: center;
    margin: 20px 0;
  }

  .label {
    font-size: 24px;
    font-weight: bold;
    margin-left: 20px;
  }

  /* Toggle switch */
  .switch {
    position: relative;
    width: 60px;
    height: 30px;
  }

  .switch input {
    display: none;
  }

  .slider {
    position: absolute;
    cursor: pointer;
    background: #ccc;
    border-radius: 30px;
    width: 100%;
    height: 100%;
    transition: 0.3s;
  }

  .slider::before {
    content: "";
    position: absolute;
    width: 26px;
    height: 26px;
    left: 2px;
    top: 2px;
    background: white;
    border-radius: 50%;
    transition: 0.3s;
  }

  input:checked + .slider {
    background: #4caf50;
  }

  input:checked + .slider::before {
    transform: translateX(30px);
  }
</style>
</head>
<body>

<div class="container">
  <div class="row">
    <label class="switch">
      <input type="checkbox" id="good">
      <span class="slider"></span>
    </label>
    <div class="label">GOOD</div>
  </div>

  <div class="row">
    <label class="switch">
      <input type="checkbox" id="cheap">
      <span class="slider"></span>
    </label>
    <div class="label">CHEAP</div>
  </div>

  <div class="row">
    <label class="switch">
      <input type="checkbox" id="fast">
      <span class="slider"></span>
    </label>
    <div class="label">FAST</div>
  </div>
</div>

<script>
  const good = document.getElementById("good");
  const cheap = document.getElementById("cheap");
  const fast = document.getElementById("fast");

  function handleToggle(clicked) {
    const checkedCount =
            (good.checked ? 1 : 0) +
            (cheap.checked ? 1 : 0) +
            (fast.checked ? 1 : 0);

    // Nếu bật cả 3 → tắt 1 cái khác
    if (checkedCount === 3) {
      if (clicked === good) {
        fast.checked = false;
      } else if (clicked === cheap) {
        good.checked = false;
      } else if (clicked === fast) {
        cheap.checked = false;
      }
    }
  }

  good.addEventListener("change", () => handleToggle(good));
  cheap.addEventListener("change", () => handleToggle(cheap));
  fast.addEventListener("change", () => handleToggle(fast));
</script>

</body>
<body>

</body>
</html>
