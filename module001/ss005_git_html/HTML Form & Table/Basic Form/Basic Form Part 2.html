<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký học viên</title>
</head>
<body bgcolor="#FFFF99">

<form>
    <table align="center" width="700" cellpadding="10">
        <tr>
            <td colspan="2" bgcolor="#b2e0d6">
                <font color="Blue" size="5">Đăng ký học viên</font>
            </td>
        </tr>
        <tr>
            <td width="100">
                <font color="blue">Họ và tên</font>
            </td>
            <td><input type="text" name="your name" size="40"></td>
        </tr>
        <tr>
            <td width="80">
                <font color="blue">Ngày sinh</font>
            </td>
            <td><input type="text" name="birthday" size="30"></td>
        </tr>
        <tr>
            <td>
                <font color="blue" size="3">Giới tính</font>
            </td>
            <td>
                <input type="radio" name="gender"> Nam
                <input type="radio" name="gender"> Nữ
            </td>
        </tr>
        <tr>
            <td valign="top"><font color="blue">Địa chỉ</font></td>
            <td>
                <textarea name="address" rows="4" cols="40"></textarea>
            </td>
        </tr>
        <tr>
            <td><font color="blue">Lớp</font></td>
            <td>
                <select name="class">
                    <option>--Chọn lớp--</option>
                    <option>Lớp 1</option>
                    <option>Lớp 2</option>
                    <option>Lớp 3</option>
                </select>
            </td>
        </tr>
        <tr>
            <td width="100">
                <font color="blue">Email</font>
            </td>
            <td><input type="text" name="email" size="40"></td>
        </tr>
        <tr>
            <td width="100">
                <font color="blue">Số điện thoại</font>
            </td>
            <td><input type="text" name="Number" size="40"></td>
        </tr>
        <tr>
            <td></td>
            <td>
                <input type="Submit" value="Gửi thông tin">
                <input type="Reset" value="Nhập lại">
            </td>
        </tr>
    </table>
</form>


</body>
</html>
