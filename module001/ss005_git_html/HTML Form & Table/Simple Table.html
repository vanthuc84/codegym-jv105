<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Schedule</title>

  <style>
    body {
      background-color: #f2f2f2;
      font-family: Arial;
    }

    /* Khung chính */
    .container {
      width: 80%;
      margin: 50px auto;
      border: 2px solid #333;
      border-radius: 10px;
      background-color: white;
      padding: 20px;
    }

    /* Bảng */
    table {
      width: 100%;
      text-align: center;
      border-collapse: collapse;
    }

    /* Ô */
    td {
      padding: 20px;
      border: 1px solid #ccc;
    }

    /* Tiêu đề */
    .title {
      font-size: 22px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 10px;
    }

    /* Nội dung */
    .content {
      font-size: 18px;
      line-height: 1.6;
    }
  </style>

</head>

<body>

<div class="container">
  <table>
    <tr>
      <td>
        <div class="title">Thứ 3</div>
        <div class="content">
          CF - T1, L1 <br>
          CF - T4, L4
        </div>
      </td>

      <td>
        <div class="title">Thứ 5</div>
        <div class="content">
          CF - T1, L2 <br>
          CF - Written Test
        </div>
      </td>

      <td>
        <div class="title">Thứ 7</div>
        <div class="content">
          CF - T1, L3 <br>
          C - T3, L3
        </div>
      </td>
    </tr>
  </table>
</div>

</body>
</html>
